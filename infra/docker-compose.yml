name: btdamageresolver
services:
  # Battletech Damage Resolver (orleans silo)
  resolver:
    container_name: resolver
    hostname: resolver
    image: resolver:latest
    environment:
      DOTNET_ENVIRONMENT: Release
      ConnectionStrings__Postgres: "User ID=${RESOLVER_USER:?err};Password=${RESOLVER_PASSWORD:?err};Host=host.docker.internal;Port=5432;Database=resolver;"
      ConnectionStrings__Redis: "redis:6379,password=${RESOLVER_PASSWORD:?err}"
    networks:
      - resolvernet
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    logging:
      driver: k8s-file
      options:
        path: /var/log/containers/resolver.log
        max-size: 4mb

  # Battletech Damage Resolver Client
  resolverclient:
    container_name: resolverclient
    hostname: resolverclient
    image: resolverclient:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ConnectionStrings__Redis: "redis:6379,password=${RESOLVER_PASSWORD:?err}"
    ports:
      - 8787:8080
    volumes:
      - resolverclient-dpkeys:/app/dpkeys
    networks:
      - resolvernet
    depends_on:
      - resolver
    restart: on-failure
    logging:
      driver: k8s-file
      options:
        path: /var/log/containers/resolverclient.log
        max-size: 4mb

  # Data Importer
  resolverdataimporter:
    container_name: resolverdataimporter
    hostname: resolverdataimporter
    image: resolverdataimporter:latest
    environment:
      DOTNET_ENVIRONMENT: Release
      ConnectionStrings__Redis: "redis:6379,password=${RESOLVER_PASSWORD:?err}"
    networks:
      - resolvernet
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: k8s-file
      options:
        path: /var/log/containers/resolverdataimporter.log
        max-size: 4mb

  # Data Exporter
  resolverdataexporter:
    profiles: ["export"]
    container_name: resolverdataexporter
    hostname: resolverdataexporter
    image: resolverdataexporter:latest
    environment:
      DOTNET_ENVIRONMENT: Release
      ConnectionStrings__Redis: "redis:6379,password=${RESOLVER_PASSWORD:?err}"
    networks:
      - resolvernet
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./tmp:/app/data
    logging:
      driver: k8s-file
      options:
        path: /var/log/containers/resolverdataexporter.log
        max-size: 4mb

  # Redis
  redis:
    container_name: redis
    image: resolverredis:latest
    environment:
      REDIS_PASSWORD: "${RESOLVER_PASSWORD:?err}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    ports:
      - 63790:6379
    volumes:
      - redis-data:/db
    networks:
      - resolvernet
    restart: on-failure
    logging:
      driver: k8s-file
      options:
        path: /var/log/containers/resolverredis.log
        max-size: 4mb

networks:
  resolvernet:

volumes:
  redis-data:
  resolverclient-dpkeys:
